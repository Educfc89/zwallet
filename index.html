    } else if (ZW.onAction) ZW.onAction(a);
  });
})();
(function () {

  ZW.onAction = function (a) {

      var u = (document.getElementById("br-url") || {}).value || "", t = (document.getElementById("br-tok") || {}).value || "", m = document.getElementById("brmsg");

<style>

:root {
  --bg: #EEF1EF; --surface: #FFFFFF; --ink: #101C19; --ink-2: #4B5C57;

    --good: #5FD39A; --warn: #E8B64C; --bad: #F08A7C; --info: #8CA0FF;
    --c1: #4FC3A1; --c2: #F2994A; --c3: #7C93FF; --c4: #E37BC0; --c5: #E0B83C;
    --c6: #9DB0C2; --c7: #E8806B; --c8: #55C1DE; --c9: #A98FEA; --c10: #A9C94F; --c11: #C9A27F; --c12: #F08AA0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1513; --surface: #17211E; --ink: #E8EFEC; --ink-2: #9DB0A9;
  --line: #2A3935; --track: #243430; --bar: #3A4E48;
  --primary: #E8EFEC; --on-primary: #0E1513;
  --good: #5FD39A; --warn: #E8B64C; --bad: #F08A7C; --info: #8CA0FF;

  --c6: #9DB0C2; --c7: #E8806B; --c8: #55C1DE; --c9: #A98FEA; --c10: #A9C94F; --c11: #C9A27F; --c12: #F08AA0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

h2 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; }

:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.idle { color: var(--ink-2); }
.label { margin-top: 18px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); }

.pos { color: var(--good); } .neg { color: var(--bad); }

.catlist { display: flex; flex-direction: column; margin-top: 10px; }
.catrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; text-align: left; padding: 10px 8px; margin-inline: -8px; border: 0; border-radius: 10px; background: transparent; width: calc(100% + 16px); }

.list { list-style: none; margin: 12px 0 0; padding: 0; }

  /* ----- Cuotas ----- */
  function viewCuotas() {
    var P = plans(), active = P.filter(function (p) { return p.pending > 0; }), done = P.filter(function (p) { return p.pending === 0 && p.end >= CUR_KEY; }), old = P.filter(function (p) { return p.pending === 0 && p.end < CUR_KEY; });

  /* ----- Ingresos ----- */

  function viewAnio() {
    var Y = CUR_KEY.slice(0, 4), ppl = state.people, rows = [], tIn = 0, tOut = 0, byc = {}, pOut = {}, pIn = {}, ahead = 0, aheadKeys = [];

    monthKeys().filter(function (k) { return k.slice(0, 4) === Y; }).forEach(function (k) {
      var T = totals(k), I = incomeTotal(k);
      if (k > CUR_KEY) { if (T.total > 0) { ahead += T.total; aheadKeys.push(k); } return; }
      if (!T.total && !I) return;
      var C = calc(k), IB = incomeBy(k);
      rows.push({ k: k, inc: I, out: T.total, C: C });
      tIn += I; tOut += T.total;
      Object.keys(T.by).forEach(function (c) { byc[c] = (byc[c] || 0) + T.by[c]; });

      '<dl class="stats"><div><dt>Ingresos del año</dt><dd class="num pos">' + fmt(tIn) + '</dd></div><div><dt>Gastos del año</dt><dd class="num">' + fmt(tOut) + '</dd></div><div><dt>Diferencia</dt><dd class="num ' + (bal >= 0 ? "pos" : "neg") + '">' + fmt(bal) + '</dd></div><div><dt>Gasto promedio al mes</dt><dd class="num">' + fmt(avgOut) + "</dd></div>" +

      '<div class="yearchart">' + bars(rows.map(function (r) { return r.k; }), rows.map(function (r) { return r.out; }), CUR_KEY, avgIn, "Gastos por mes de " + Y) + '</div><p class="note">Barras: gastos de cada mes. Línea punteada: ingreso promedio mensual (' + fmt(avgIn) + ").</p>" +
      (ahead > 0 ? '<p class="note">Ya comprometido para ' + aheadKeys.map(monthName).join(", ") + ": " + fmt(ahead) + " (cuotas y gastos cargados por adelantado).</p>" : "") + "</section>";
    var trs = rows.map(function (r) {
      var d = r.inc - r.out;
      return '<tr><td><button class="linkbtn" type="button" data-act="ymonth:' + r.k + '">' + esc(monthLabel(r.k)) + '</button></td><td class="num">' + fmt(r.inc) + '</td><td class="num">' + fmt(r.out) + '</td><td class="num ' + (d >= 0 ? "pos" : "neg") + '">' + fmt(d) + "</td>" +
        ppl.map(function (p) { return '<td class="num">' + fmt(r.C.owed[p.id] || 0) + "</td>"; }).join("") + "</tr>";
    }).join("");
    var table = '<section class="card"><h2>Mes por mes</h2><p class="sec-sub">Toca un mes para ver su detalle.</p><div class="tblwrap"><table class="tbl"><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Diferencia</th>' + ppl.map(function (p) { return "<th>" + esc(p.name) + "</th>"; }).join("") + "</tr></thead><tbody>" + trs +
      '<tr class="tot"><td>Total</td><td class="num">' + fmt(tIn) + '</td><td class="num">' + fmt(tOut) + '</td><td class="num ' + (bal >= 0 ? "pos" : "neg") + '">' + fmt(bal) + "</td>" + ppl.map(function (p) { return '<td class="num">' + fmt(pOut[p.id]) + "</td>"; }).join("") + "</tr></tbody></table></div></section>";

    var cats = '<section class="card"><h2>En qué se fue el año</h2><p class="sec-sub">Suma de todos los meses, por categoría.</p><div class="catlist">' + entries.map(function (e) {
      return '<div class="catrow" style="cursor:default"><span class="cr-name"><span class="ce">' + catEmoji(e) + '</span>' + esc(e.name) + '</span><span class="cr-amt num">' + fmt(e.amt) + '</span><span class="cr-bar"><span style="width:' + (e.amt / mx * 100).toFixed(1) + "%;background:" + e.color + '"></span></span><span class="cr-pct num">' + Math.round(e.amt / tOut * 100) + "%</span></div>"; }).join("") + "</div></section>";
    return '<div class="yeargrid">' + head + table + cats + "</div>";
  }

  }
  function sheetBuild(key, s, n) {
    var cat = SHEET_CATS[s.cat], d = s.k;
    if (cat === "fijo") cat = SHEET_FIJO[d] || "fijo";
    else if (cat === "comun") { for (var i = 0; i < SHEET_RULES.length; i++) if (SHEET_RULES[i][1].test(d)) { cat = SHEET_RULES[i][0]; break; } }
    var cd = SHEET_CARD[s.card] || "kGF", resp = s.resp || (["kVG", "kMG", "kMPE"].indexOf(cd) >= 0 ? "Eduardo" : "Zaydi");
    var split = resp === "Ambos" ? ["p1", "p2"] : resp === "Eduardo" ? ["p1"] : resp === "Zaydi" ? ["p2"] : ["p1", "p2"];
    var t = { id: "x" + Date.now() + n, seq: 5000000 + Date.now() % 1000000 + n, desc: s.desc, cat: cat, card: cd, split: split, note: "", usd: null, card2: "", part2: 0, date: s.date || (shiftKey(key, -1) + "-28"), pm: key, amt: s.amt, inst: null, rec: SHEET_CATS[s.cat] === "fijo" };
    if (resp === "Ambos" && Math.abs(s.H - s.I) > 1 && s.H + s.I > 0) t.w = { p1: Math.round(s.H * 100) / 100, p2: Math.round(s.I * 100) / 100 };
    if (s.K && s.K > 1) t.note = "Cuota (de " + Math.round(s.K) + "), revisar";
    return t;
  }
  function sheetPlan(mo) {
    var key = mo.key, S = mo.rows, A = chargesOf(key).map(function (c) { var tot = c.amt, m = /^Total ([\d,\.]+);/.exec(c.t.note || ""); if (m) tot = parseFloat(m[1].replace(/[,\.]/g, "")); return { id: c.t.id, k: sNorm(c.t.desc), amt: tot, plan: !!c.label, desc: c.t.desc, real: c.amt }; });
    var plain = A.filter(function (a) { return !a.plan; }).length;
    function same(a, s) { return s.trunc ? a.k.indexOf(s.k) === 0 : a.k === s.k; }
    var left = [], upds = [], dels = [], adds = [], review = 0;
    S.forEach(function (s) { var ix = -1; for (var i = 0; i < A.length; i++) if (same(A[i], s) && Math.abs(A[i].amt - s.amt) <= 1) { ix = i; break; } if (ix >= 0) A.splice(ix, 1); else left.push(s); });
    A = A.filter(function (a) { return /^[htnx]\d+$/.test(a.id); });
    left.slice().forEach(function (s) { var ix = -1; for (var i = 0; i < A.length; i++) if (same(A[i], s)) { ix = i; break; } if (ix >= 0) { var a = A.splice(ix, 1)[0]; left.splice(left.indexOf(s), 1); if (a.plan) review++; else upds.push({ id: a.id, desc: a.desc, amt: s.amt, date: s.date }); } });
    left.forEach(function (s, i) { adds.push({ tx: sheetBuild(key, s, i) }); });
    A.forEach(function (a) { if (a.plan) review++; else dels.push({ id: a.id, desc: a.desc, amt: a.real }); });
    return { key: key, adds: adds, dels: dels, upds: upds, review: review, rows: S.length, plain: plain };
  }
  function sheetErr(e) {
    var c = e && e.code;
    if (c === "bridge_off") return "Falta conectar el Sheet: pega la dirección y el token aquí arriba.";
    if (c === "bridge_auth") return "El token no coincide con el de la hoja zwallet_Config.";
    if (c === "bridge_net") return "No pude llegar al script del Sheet (revisa la dirección y la conexión).";
    if (c === "bridge_err") return "El script del Sheet respondió con un error: mira la hoja zwallet_Diagnóstico.";
    if (c === "needs_reauth") return "Vuelve a conectar Google Drive en Ajustes > Conectores de Claude.";
    if (c === "server_not_connected" || c === "selection_required") return "No encuentro la conexión con Google Drive en tu cuenta.";
    if (c === "not_in_manifest" || c === "consent_required") return "No diste permiso a Google Drive para esta app.";
    if (c === "not_granted" || c === "capability_disabled") return "Esta vista no permite conectarse a Google Drive.";
    return "No pude leer el Sheet (" + (c || "error") + "). Prueba de nuevo en un rato.";
  }
  async function sheetApply(pl) {
    if (SYNC.db && SYNC.canWrite) await snapSave("Antes de traer del Sheet", true);
    var del = {}; pl.dels.forEach(function (d) { del[d.id] = 1; });
    var upd = {}; pl.upds.forEach(function (u) { upd[u.id] = u; });
    state.tx = state.tx.filter(function (t) { return !del[t.id]; });
    state.tx.forEach(function (t) { var u = upd[t.id]; if (u) { t.amt = u.amt; if (u.date) t.date = u.date; delete t.w; } });
    pl.adds.forEach(function (a) { state.tx.push(a.tx); });
    state.tx.forEach(function (t) { if (t.pm) ensureMonth(t.pm); });
    SHEETUI.plan = null;
    SHEETUI.msg = "Sheet al día: " + pl.adds.length + " nuevos, " + pl.dels.length + " borrados, " + pl.upds.length + " con otro monto.";
    say(SHEETUI.msg, "ok"); render();
  }
  async function sheetRun(auto) {
    if (SHEETUI.busy) return;
    SHEETUI.busy = true; if (!auto) { SHEETUI.msg = ""; render(); }
    try {
      var text = (await ZW.bridge("read")).text || "";
      var months = sheetParse(text), mo = months[0];
      if (!mo || mo.rows.length < 10) throw { code: "lectura" };
      var pl = sheetPlan(mo);
      if (pl.rows < pl.plain * 0.6) throw { code: "lectura_corta" };
      var tot = pl.adds.length + pl.dels.length + pl.upds.length;
      SHEETUI.last = Date.now();
      if (!tot) { SHEETUI.msg = "Sheet al día (" + monthName(pl.key) + "), sin cambios." + (pl.review ? " " + pl.review + " cuota(s) distintas para revisar a mano." : ""); }
      else if (tot <= 10 && pl.dels.length <= 3) { SHEETUI.busy = false; await sheetApply(pl); return; }
      else { SHEETUI.plan = pl; SHEETUI.msg = "Hay " + tot + " cambios: revisa y confirma."; }
    } catch (e) { SHEETUI.msg = (e && (e.code === "lectura" || e.code === "lectura_corta")) ? "No pude leer bien el Sheet; no cambié nada." : sheetErr(e); }
    SHEETUI.busy = false; if (ui.tab === "ajustes" && !formOpen()) render();
  }
  function csvQ(v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function csvN(v) { return v ? (Math.round(v * 100) / 100).toFixed(2).replace(".", ",") : ""; }
  function csvD(iso) { return iso && /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso.slice(8) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4) : ""; }
  function sheetCsv(key) {
    var ppl = state.people, p1 = ppl[0] && ppl[0].id, p2 = ppl[1] && ppl[1].id, rows = [["Categoría", "Descripcion", "Emisor", "Monto", "Fecha", "Responsable", "Ambos", ppl[0] ? ppl[0].name : "Eduardo", ppl[1] ? ppl[1].name : "Zaydi", "Termina", "Cuotas", "Categoria app"]];
    chargesOf(key).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (c) {
      var t = c.t, cd = cardOf(t.card), sp = t.split || [], sh = {}, tot = 0, cat = catOf(t.cat), g;
      sp.forEach(function (id) { var w = t.w && t.w[id] != null ? t.w[id] : 1; sh[id] = w; tot += w; });
      Object.keys(sh).forEach(function (id) { sh[id] = tot ? c.amt * sh[id] / tot : 0; });
      g = c.label ? "1 Cuota" : t.rec ? "2 Gasto Fijo" : t.cat === "mercado" ? "3 Mercado" : t.cat === "bolu" ? "5 Bolu Compra" : "4 Compra Comun";
      var resp = sp.length > 1 ? "Ambos" : (sp[0] ? personName(sp[0]) : "");
      var end = t.inst && t.inst.n > 1 ? "01/" + shiftKey(t.pm, t.inst.n - 1).slice(5) + "/" + shiftKey(t.pm, t.inst.n - 1).slice(0, 4) : "";
      rows.push([g, t.desc, cd ? cd.name : "", csvN(c.amt), csvD(t.date), resp, sp.length > 1 ? csvN(c.amt / 2) : "", csvN(sh[p1] || 0), csvN(sh[p2] || 0), end, t.inst && t.inst.n > 1 ? t.inst.n : "", cat ? cat.name : ""]);
    });
    return rows.map(function (r) { return r.map(csvQ).join(","); }).join("\n");
  }
  async function sheetExport() {
    if (SHEETUI.xbusy) return;
    SHEETUI.xbusy = true; SHEETUI.out = null; SHEETUI.msg = ""; render();
    var key = sheetXKey(), d = new Date(), z = function (n) { return (n < 10 ? "0" : "") + n; };
    var title = "zwallet " + monthName(key) + " " + key.slice(0, 4) + " (" + z(d.getDate()) + "-" + z(d.getMonth() + 1) + " " + z(d.getHours()) + "." + z(d.getMinutes()) + ")";
    try {
      var r = await ZW.bridge("write", { name: monthName(key) + " " + key.slice(0, 4), csv: sheetCsv(key) });
      SHEETUI.out = r.url ? { url: r.url, title: r.name } : null;
      SHEETUI.msg = r.url ? "" : "Se creó la hoja " + r.name + " en tu Sheet.";
    } catch (e) { SHEETUI.msg = sheetErr(e); }
    SHEETUI.xbusy = false; render();
  }
  window.ZW && (window.ZW.rerender = function () { render(); });
  function sheetAct(a) {
    if (a === "out") { sheetExport(); return; }
    if (a === "cfgput") { cfgRun("put"); return; }
    if (a === "cfgget") { cfgRun("get"); return; }
    if (a === "run") { sheetRun(false); return; }
    if (a === "no") { SHEETUI.plan = null; SHEETUI.msg = "Cancelado, no cambié nada."; render(); return; }
    if (a === "ok" && SHEETUI.plan) { sheetApply(SHEETUI.plan); }
  }
  (function sheetAuto() {
    var tries = 0, done = false;
    var t = setInterval(async function () {
      if (done || ++tries > 90) { clearInterval(t); return; }
      if (!SYNC.ready || !SYNC.canWrite || SYNC.timer || SYNC.busy || formOpen()) return;
      done = true; clearInterval(t);
      if (!(window.ZW && ZW.bridgeCfg && ZW.bridgeCfg.url)) return;
      sheetRun(true);
    }, 1500);
  })();

})();
</script>
